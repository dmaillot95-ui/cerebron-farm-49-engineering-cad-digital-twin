name: ARCHITECTON CAD MVP-05
on:
  push:
    paths:
      - 'projects/benchmark_part_001/mvp05_redteam.py'
      - '.github/workflows/architecton-cad-mvp05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic Red Team
        run: python projects/benchmark_part_001/mvp05_redteam.py
      - name: Upload MVP-05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecton-mvp05-redteam
          path: projects/benchmark_part_001/out_mvp05/
          if-no-files-found: warn
          retention-days: 30
