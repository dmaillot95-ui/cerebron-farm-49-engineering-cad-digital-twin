name: ARCHITECTON CAD MVP-02

on:
  push:
    paths:
      - 'projects/benchmark_part_001/mvp02_propagation.py'
      - '.github/workflows/architecton-cad-mvp02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parametric-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CAD engine
        run: python -m pip install 'cadquery==2.8.0'
      - name: Run MVP-02 propagation gate
        run: python projects/benchmark_part_001/mvp02_propagation.py
      - name: Upload MVP-02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecton-mvp02-propagation
          path: projects/benchmark_part_001/out_mvp02/
          if-no-files-found: warn
          retention-days: 30
