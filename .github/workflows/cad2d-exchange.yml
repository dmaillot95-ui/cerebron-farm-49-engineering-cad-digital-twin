name: FARM49 CAD 2D Exchange Gate
on:
  workflow_dispatch:
  push:
    paths:
      - "projects/arx_m210_cad_master_v0/cad2d_exchange.py"
      - "projects/arx_m210_cad_master_v0/cad2d_spec.json"
jobs:
  cad2d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate traceable CAD exchange
        run: python projects/arx_m210_cad_master_v0/cad2d_exchange.py
      - uses: actions/upload-artifact@v4
        with:
          name: farm49-cad2d-exchange
          path: projects/arx_m210_cad_master_v0/artifacts/
